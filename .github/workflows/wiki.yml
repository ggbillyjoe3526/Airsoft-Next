name: Wiki

# Publishes the game's wiki (docs/wiki/, one Markdown file per page) to this repository's GitHub wiki on every push to
# main. tools/wiki.py fills the pages' tables from the game's data and writes Patch-Notes from changelog.d/ and
# CHANGELOG.md, so any merge can change a page; a build with nothing new pushes nothing. Pages edited in the wiki's web
# editor are overwritten: edit docs/wiki/ instead (docs/wiki/README.md). Actions > Wiki > Run workflow republishes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # pushing to the wiki of the same repository

# One publish at a time, in merge order.
concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the wiki
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Patch-Notes orders the upcoming notes by when they were added

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check the pages
        run: python3 tools/wiki.py check

      - name: Build the pages
        run: python3 tools/wiki.py build build/wiki

      - name: Push to the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          if ! git clone --quiet "$remote" wiki-repo; then
            echo "::error::The wiki can't be cloned. Check Settings > General > Features > Wikis is ticked, and that the wiki has a first page (Wiki tab > Create the first page), then run Actions > Wiki > Run workflow."
            exit 1
          fi
          rsync -a --delete --exclude .git build/wiki/ wiki-repo/
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is already up to date."
            exit 0
          fi
          git commit --quiet -m "Update the wiki from ${GITHUB_SHA::7}"
          git push --quiet origin HEAD
          echo "Published: https://github.com/${GITHUB_REPOSITORY}/wiki"
